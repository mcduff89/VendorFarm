# Makes a GitHub release whenever the version in VendorFarm.toc changes.
# Push as usual from GitHub Desktop: if "## Version" is new, this builds
# VendorFarm-<version>.zip (one VendorFarm folder with only the files the
# game needs) and publishes it as release v<version>. Pushes that don't
# change the version do nothing.
name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          version=$(grep -m1 '^## Version:' VendorFarm.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p build/VendorFarm
          grep -v '^#' VendorFarm.toc | tr -d '\r' | grep '\.lua$' | while read -r f; do
            cp "$f" build/VendorFarm/
          done
          cp VendorFarm.toc README.md LICENSE build/VendorFarm/
          cd build && zip -qr "../VendorFarm-${{ steps.v.outputs.version }}.zip" VendorFarm

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          v="${{ steps.v.outputs.version }}"
          change=$(grep -m1 "^- $v " README.md || echo "VendorFarm $v")
          repo="https://github.com/${{ github.repository }}"
          raw="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          notes=$(printf '%s\n\n**Install:** download `VendorFarm-%s.zip` below and extract it into `World of Warcraft\\_forever_\\Interface\\AddOns`. Every feature: [README](%s#readme)\n' "$change" "$v" "$repo")
          gh release create "v$v" "VendorFarm-$v.zip" --title "VendorFarm $v" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
